<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Bit Retro Soundtrack Generator</title>
    <meta name="description" content="Tarayıcıda çalışan, prosedürel retro müzik üreticisi: mixer, reverb/delay, MIDI dışa aktarım ve preset kaydetme.">
    <meta name="theme-color" content="#1a0b2e">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <div class="scanlines"></div>

    <main id="container">
        <h1>32-BIT SYNTH</h1>

        <div class="visualizer" id="visualizer"></div>

        <div id="controls">
            <select id="genreSelect" class="control-element" aria-label="Müzik türü"></select>
            <button id="btnPlay" class="control-element" type="button">BAŞLAT</button>
            <button id="btnRandom" class="control-element control-pink" type="button">YENİ ŞARKI</button>
            <button id="btnMidi" class="control-element control-blue" type="button">MIDI</button>
            <button id="btnRecord" class="control-element control-red" type="button" disabled>REC</button>
        </div>

        <div class="status" id="statusText">SİSTEM HAZIR.</div>
        <div class="engine-info" id="engineInfo"></div>

        <details class="panel" open>
            <summary>MİXER</summary>
            <div class="panel-body">
                <div class="mixer-channels" id="mixerChannels"></div>
                <div class="mixer-buses" id="mixerBuses"></div>
                <p class="panel-hint">SPACE çal/duraklat · R yeni şarkı · M master mute · sürgüleri çift tıklayarak sıfırla</p>
            </div>
        </details>

        <details class="panel">
            <summary>PRESET &amp; DOSYA</summary>
            <div class="panel-body">
                <div class="row">
                    <input id="presetName" class="text-input" type="text" maxlength="24" placeholder="PRESET ADI" autocomplete="off" aria-label="Preset adı">
                    <button id="presetSave" class="control-element control-small" type="button">KAYDET</button>
                    <button id="presetExport" class="control-element control-small control-blue" type="button">JSON İNDİR</button>
                    <button id="presetImport" class="control-element control-small control-blue" type="button">JSON YÜKLE</button>
                    <input id="presetFile" type="file" accept="application/json,.json" hidden>
                </div>
                <ul class="preset-list" id="presetList"></ul>
                <p class="panel-hint">Presetler tarayıcıda saklanır, JSON ile paylaşılabilir. Son oturum açılışta geri yüklenir.</p>
            </div>
        </details>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
